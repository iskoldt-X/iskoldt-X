<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Two side-by-side terminal panes. Left: GPCR Annotation Tools, 214 commits, solo-authored -- a Gemini model proposes each structural-annotation field, deterministic validators hold veto power over every one, every override written to an append-only audit trail; being deployed, NAR manuscript submitted, first author. Right: the container platform GPCRdb runs on, 10 PRs merged, 43 stars and 75 forks -- Django plus RDKit-PostgreSQL, health-check-gated startup, multi-architecture images, and a 36-cell Python by Django by RDKit compatibility matrix automated in CI, across two container repositories of his own plus 10 PRs merged into the upstream GPCRdb codebase.">
