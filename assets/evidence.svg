<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="A tree listing of three kinds of evidence. pre-computation-pipeline: a private codebase with no public repo, staged SLURM jobs with explicit contracts, resumable, about 250 automated tests plus a golden-fixture regression suite, built on the licensed Schrodinger Suite. viral-genomes-LSTM: MSc research, PyTorch sequence models trained on HPC over 15.6 million GISAID SARS-CoV-2 genomes, Gene 2024 volume 916:148426, first author. Plasmer: co-developed as third author, a Random Forest classifier for plasmid host-range prediction, 56 citations, 1.1 thousand Docker pulls.">
